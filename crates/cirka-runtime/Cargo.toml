[package]
name = "cirka-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cirka_rt"
# Only linked into executables as `libcirka_rt.a`. Without an rlib, the
# runtime exports only its C entry points: its statics are internal, which
# it reaches directly (FEAT-1026).
crate-type = ["staticlib"]
doctest = false

[features]
# Debug runtime: magic values, poisoning, RC checks and leak reports.
debug-rt = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# The ThreadSanitizer flavour (scripts/build-runtime.sh): libc's I/O calls.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cirka_tsan)"] }

[dependencies]
cirka-bigint = { path = "../cirka-bigint" }
